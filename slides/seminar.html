" lang="ja-JP" data-marpit-pagination="57" style="--paginate:true;--header:3. 実習① ⑦ 角度の関数;--style:@import 'marp_theme.css';

<header>3. 実習① ⑦ 角度の関数</header>

<h1 id="2%E6%9C%AC%E3%81%AE%E7%9F%A2%E5%8D%B0%E3%81%AE%E3%81%AA%E3%81%99%E8%A7%92%E3%81%AE%E9%96%A2%E6%95%B0">2本の矢印のなす角の関数</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">angle_between_vectors</span>(<span class="hljs-params">v1, v2</span>):
    v1 = v1 / np.linalg.norm(v1)
    v2 = v2 / np.linalg.norm(v2)
    cos_angle = np.clip(np.dot(v1, v2), -<span class="hljs-number">1.0</span>, <span class="hljs-number">1.0</span>)
    <span class="hljs-keyword">return</span> np.degrees(np.arccos(cos_angle))
</code></pre>
<ul>
<li>役割：2本の矢印のなす角を出す（2節の式そのもの）</li>
<li>入力：2本の矢印<code>v1</code>と<code>v2</code>　出力：角度（度）</li>
<li>中身は読み飛ばしてよい</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="3. 実習① ⑦ 角度の関数" data-style="@import 'marp_theme.css';
" lang="ja-JP" data-marpit-pagination="58" style="--paginate:true;--header:3. 実習① ⑦ 角度の関数;--style:@import 'marp_theme.css';
;" data-marpit-pagination-total="137">
<header>3. 実習① ⑦ 角度の関数</header>

<h1 id="%E8%82%A9%E6%8C%99%E4%B8%8A%E8%A7%92%E3%81%AE%E9%96%A2%E6%95%B0">肩挙上角の関数</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">shoulder_elevation</span>(<span class="hljs-params">p</span>):
    <span class="hljs-comment"># 1. どの点を使うか（番号は0から数える）</span>
    shoulder, elbow = p[<span class="hljs-number">12</span>], p[<span class="hljs-number">14</span>]
    mid_shoulder = (p[<span class="hljs-number">11</span>] + p[<span class="hljs-number">12</span>]) / <span class="hljs-number">2</span>
    mid_hip = (p[<span class="hljs-number">23</span>] + p[<span class="hljs-number">24</span>]) / <span class="hljs-number">2</span>
    <span class="hljs-comment"># 2. 2本の線を作る</span>
    upper_arm = elbow - shoulder        <span class="hljs-comment"># 移動アーム</span>
    trunk = mid_hip - mid_shoulder      <span class="hljs-comment"># 固定アーム</span>
    <span class="hljs-comment"># 3. なす角を返す</span>
    <span class="hljs-keyword">return</span> angle_between_vectors(upper_arm, trunk)
</code></pre>

;" data-marpit-pagination-total="137">
<header>4. 信じてよいか ① 毎回のピーク</header>

<h1 id="%E3%83%94%E3%83%BC%E3%82%AF%E3%82%92%E6%95%B0%E3%81%88%E3%81%A6sd%E3%82%92%E5%87%BA%E3%81%99">ピークを数えてSDを出す</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">peak_summary</span>(<span class="hljs-params">angle</span>):
    angle = np.nan_to_num(angle)     <span class="hljs-comment"># 空欄は0として山を探す</span>
    peaks, _ = find_peaks(angle, height=<span class="hljs-number">90</span>, prominence=<span class="hljs-number">30</span>)
    values = angle[peaks]
    sd = values.std(ddof=<span class="hljs-number">1</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">len</span>(peaks), values.mean(), sd, <span class="hljs-number">1.96</span> * np.sqrt(<span class="hljs-number">2</span>) * sd

<span class="hljs-keyword">for</span> name, angle <span class="hljs-keyword">in</span> [(<span class="hljs-string">&#x27;正解&#x27;</span>, truth), (<span class="hljs-string">&#x27;2D&#x27;</span>, angle2d), (<span class="hljs-string">&#x27;3D&#x27;</span>, angle3d)]:
    n, mean, sd, mdc = peak_summary(angle)
    <span class="hljs-built_in">print</span>(name, <span class="hljs-string">&#x27;回数&#x27;</span>, n, <span class="hljs-string">&#x27;平均&#x27;</span>, <span class="hljs-built_in">round</span>(mean, <span class="hljs-number">1</span>), <span class="hljs-string">&#x27;SD&#x27;</span>, <span class="hljs-built_in">round</span>(sd, <span class="hljs-number">1</span>),
          <span class="hljs-string">&#x27;MDC95&#x27;</span>, <span class="hljs-built_in">round</span>(mdc, <span class="hljs-number">1</span>))
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-header="4. 信じてよいか ① 毎回のピーク" data-style="@import 'marp_theme.css';

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">正解 回数 5 平均 127.7 SD 7.0 MDC95 19.4

3D 回数 5 平均 126.1 SD 6.7 MDC95 18.6
</code></pre>
<ul>
<li><code>find_peaks</code>は山を探す道具。90°を超えた山を1回と数える</li>
<li>正解でも、5回のピークのSDは7.0°ある</li>

<p>ピークの揺れの大部分は、MediaPipeの誤差ではなく本人の動きの揺れ</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-header="4. 信じてよいか ② 揺れを数にする" data-style="@import 'marp_theme.css';

<header>4. 信じてよいか ② 揺れを数にする</header>

<h1 id="%E6%B8%AC%E5%AE%9A%E3%81%AE%E6%8F%BA%E3%82%8C%E3%82%92%E8%A1%A8%E3%81%99%E6%95%B0sem">測定の揺れを表す数：SEM</h1>
<ul>
<li>同じものを繰り返し測ったときの、値の揺れの大きさ</li>
<li>測定誤差（standard error of measurement）と呼ぶ</li>
<li>同じ人の繰り返しの標準偏差（SD）が、その目安になる</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-header="4. 信じてよいか ② 揺れを数にする" data-style="@import 'marp_theme.css';

;" data-marpit-pagination-total="137">
<header>4. 信じてよいか ② 揺れを数にする</header>

<h1 id="%E5%A4%89%E3%82%8F%E3%81%A3%E3%81%9F%E3%81%A8%E8%A8%80%E3%81%88%E3%82%8B%E6%9C%80%E5%B0%8F%E3%81%AE%E5%B9%85mdc">変わったと言える最小の幅：MDC</h1>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mrow><mi mathvariant="normal">M</mi><mi mathvariant="normal">D</mi><mi mathvariant="normal">C</mi></mrow><mn>95</mn></msub><mo>=</mo><mn>1.96</mn><mo>×</mo><msqrt><mn>2</mn></msqrt><mo>×</mo><mrow><mi mathvariant="normal">S</mi><mi mathvariant="normal">E</mi><mi mathvariant="normal">M</mi></mrow></mrow><annotation encoding="application/x-tex">\mathrm{MDC}_{95} = 1.96 \times \sqrt{2} \times \mathrm{SEM}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord"><span class="mord mathrm">MDC</span></span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">95</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">1.96</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.04em;vertical-align:-0.0839em;"></span><span class="mord sqrt"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.9561em;"><span class="svg-align" style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord" style="padding-left:0.833em;"><span class="mord">2</span></span></span><span style="top:-2.9161em;"><span class="pstrut" style="height:3em;"></span><span class="hide-tail" style="min-width:0.853em;height:1.08em;"><svg xmlns="http://www.w3.org/2000/svg" width="400em" height="1.08em" viewBox="0 0 400000 1080" preserveAspectRatio="xMinYMin slice"><path d="M95,702

<li>最小可検変化量（minimal detectable change）と呼ぶ</li>

<h1 id="3%E6%9C%AC%E3%81%A7%E6%AD%A3%E8%A7%A3%E3%81%A8%E6%AF%94%E3%81%B9%E3%82%8B">3本で正解と比べる</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">compare_with_truth</span>(<span class="hljs-params">name</span>):
    p2, p3, f = track_pose(name + <span class="hljs-string">&#x27;.mp4&#x27;</span>)
    a2 = np.array([shoulder_elevation(p) <span class="hljs-keyword">for</span> p <span class="hljs-keyword">in</span> p2])
    a3 = np.array([shoulder_elevation(p) <span class="hljs-keyword">for</span> p <span class="hljs-keyword">in</span> p3])
    t = np.loadtxt(name + <span class="hljs-string">&#x27;_truth.csv&#x27;</span>, delimiter=<span class="hljs-string">&#x27;,&#x27;</span>, skiprows=<span class="hljs-number">1</span>, usecols=<span class="hljs-number">2</span>)
    <span class="hljs-keyword">return</span> np.nanmean(np.<span class="hljs-built_in">abs</span>(a2 - t)), np.nanmean(np.<span class="hljs-built_in">abs</span>(a3 - t))

<span class="hljs-keyword">for</span> name <span class="hljs-keyword">in</span> [<span class="hljs-string">&#x27;front&#x27;</span>, <span class="hljs-string">&#x27;oblique&#x27;</span>, <span class="hljs-string">&#x27;side&#x27;</span>]:
    d2, d3 = compare_with_truth(name)
    <span class="hljs-built_in">print</span>(name, <span class="hljs-string">&#x27;2Dの差&#x27;</span>, <span class="hljs-built_in">round</span>(d2, <span class="hljs-number">1</span>), <span class="hljs-string">&#x27;3Dの差&#x27;</span>, <span class="hljs-built_in">round</span>(d3, <span class="hljs-number">1</span>))
</code></pre>
<p class="note">これまでのセルでしたことを関数にまとめ、3本の動画それぞれに使う</p>
</section>

my_angle3d = np.array([shoulder_elevation(p) <span class="hljs-keyword">for</span> p <span class="hljs-keyword">in</span> my3d])

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">wrist = points3d[:, <span class="hljs-number">16</span>] - (points3d[:, <span class="hljs-number">23</span>] + points3d[:, <span class="hljs-number">24</span>]) / <span class="hljs-number">2</span>

<span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;速さの最大（m/s）&#x27;</span>, <span class="hljs-built_in">round</span>(np.nanmax(speed), <span class="hljs-number">2</span>))
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">速さの最大（m/s） 1.83
</code></pre>

<h1 id="%E3%81%AA%E3%82%81%E3%82%89%E3%81%8B%E3%81%AB%E3%81%97%E3%81%A6%E6%AD%A3%E8%A7%A3%E3%81%A8%E9%87%8D%E3%81%AD%E3%82%8B">なめらかにして正解と重ねる</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">truth_wrist = np.loadtxt(<span class="hljs-string">&#x27;front_truth_wrist.csv&#x27;</span>, delimiter=<span class="hljs-string">&#x27;,&#x27;</span>, skiprows=<span class="hljs-number">1</span>,
                         usecols=(<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>))
truth_speed = np.linalg.norm(np.diff(truth_wrist, axis=<span class="hljs-number">0</span>), axis=<span class="hljs-number">1</span>) * fps
smooth = savgol_filter(np.nan_to_num(speed), window_length=<span class="hljs-number">15</span>, polyorder=<span class="hljs-number">2</span>)
truth_smooth = savgol_filter(truth_speed, window_length=<span class="hljs-number">15</span>, polyorder=<span class="hljs-number">2</span>)
t = np.arange(<span class="hljs-built_in">len</span>(speed)) / fps
plt.plot(t, speed, color=<span class="hljs-string">&#x27;lightgray&#x27;</span>, label=<span class="hljs-string">&#x27;MediaPipe（生）&#x27;</span>)
plt.plot(t, smooth, label=<span class="hljs-string">&#x27;MediaPipe（なめらか）&#x27;</span>)
plt.plot(t, truth_smooth, color=<span class="hljs-string">&#x27;black&#x27;</span>, label=<span class="hljs-string">&#x27;正解&#x27;</span>)
plt.xlabel(<span class="hljs-string">&#x27;時間 [秒]&#x27;</span>)
plt.ylabel(<span class="hljs-string">&#x27;手首の速さ [m/s]&#x27;</span>)
plt.legend()
plt.show()
</code></pre>

;" data-marpit-pagination-total="137">

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">for</span> name, s <span class="hljs-keyword">in</span> [(<span class="hljs-string">&#x27;MediaPipe&#x27;</span>, smooth), (<span class="hljs-string">&#x27;正解&#x27;</span>, truth_smooth)]:
    peaks, _ = find_peaks(s, height=s.<span class="hljs-built_in">max</span>() * <span class="hljs-number">0.1</span>, prominence=s.<span class="hljs-built_in">max</span>() * <span class="hljs-number">0.1</span>)
    <span class="hljs-built_in">print</span>(name, <span class="hljs-string">&#x27;山の数&#x27;</span>, <span class="hljs-built_in">len</span>(peaks), <span class="hljs-string">&#x27;いちばん速いとき&#x27;</span>, <span class="hljs-built_in">round</span>(s.<span class="hljs-built_in">max</span>(), <span class="hljs-number">2</span>))
<span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;MediaPipeと正解の相関&#x27;</span>, <span class="hljs-built_in">round</span>(np.corrcoef(smooth, truth_smooth)[<span class="hljs-number">0</span>, <span class="hljs-number">1</span>], <span class="hljs-number">2</span>))
</code></pre>

<h1 id="%E9%A3%B2%E6%B0%B4%E8%AA%B2%E9%A1%8C%E3%81%AF%E4%B8%8A%E8%82%A2%E3%81%AE%E8%A9%95%E4%BE%A1%E3%81%A7%E3%82%88%E3%81%8F%E4%BD%BF%E3%81%86">飲水課題は上肢の評価でよく使う</h1>
<ul>
<li>1つの課題に、手を伸ばす・運ぶ・口元で保つ・戻すがそろっている</li>
<li>脳卒中後の上肢の運動学的評価で、勧められている課題の1つ</li>
<li>ここでは角度の正しさは問わず、「動作の区切り」を読む</li>
</ul>

" lang="ja-JP" data-marpit-pagination="114" style="--paginate:true;--header:6. 飲水動作 ② 区切りを読む;--style:@import 'marp_theme.css';
;" data-marpit-pagination-total="137">
<header>6. 飲水動作 ② 区切りを読む</header>

<h1 id="%E6%89%8B%E3%81%AE%E9%AB%98%E3%81%95%E3%81%A8%E8%82%98%E3%81%AE%E8%A7%92%E5%BA%A6%E3%82%92%E6%B8%AC%E3%82%8B">手の高さと肘の角度を測る</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">d2, d3, dfps = track_pose(<span class="hljs-string">&#x27;drink.mp4&#x27;</span>)
mid_shoulder = (d3[:, <span class="hljs-number">11</span>] + d3[:, <span class="hljs-number">12</span>]) / <span class="hljs-number">2</span>
hand = d3[:, <span class="hljs-number">16</span>] - mid_shoulder
height = -hand[:, <span class="hljs-number">1</span>]
elbow = np.array([<span class="hljs-number">180</span> - angle_between_vectors(p[<span class="hljs-number">12</span>] - p[<span class="hljs-number">14</span>], p[<span class="hljs-number">16</span>] - p[<span class="hljs-number">14</span>])
                  <span class="hljs-keyword">for</span> p <span class="hljs-keyword">in</span> d3])
<span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;コマ数&#x27;</span>, <span class="hljs-built_in">len</span>(d3))
<span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;手の高さ 最小&#x27;</span>, <span class="hljs-built_in">round</span>(np.nanmin(height), <span class="hljs-number">2</span>), <span class="hljs-string">&#x27;最大&#x27;</span>, <span class="hljs-built_in">round</span>(np.nanmax(height), <span class="hljs-number">2</span>))
<span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;肘の屈曲角 最小&#x27;</span>, <span class="hljs-built_in">round</span>(np.nanmin(elbow)), <span class="hljs-string">&#x27;最大&#x27;</span>, <span class="hljs-built_in">round</span>(np.nanmax(elbow)))
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">コマ数 650
手の高さ 最小 -0.41 最大 -0.03
肘の屈曲角 最小 25 最大 98
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="115" data-paginate="true" data-header="6. 飲水動作 ② 区切りを読む" data-style="@import 'marp_theme.css';

<h1 id="3%E8%A1%8C%E3%81%9A%E3%81%A4%E8%AA%AD%E3%82%80">3行ずつ読む</h1>
<ul>
<li>腰が写っていないので、右手首（16番）を両肩の中点からの位置にする</li>
<li>MediaPipeの3Dの点は下向きが正。<code>-</code>を付けて上向きを正にする</li>
<li>肘の屈曲角は、肘を軸に肘→肩と肘→手首のなす角を180°から引く</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="116" data-paginate="true" data-header="6. 飲水動作 ② 区切りを読む" data-style="@import 'marp_theme.css';
" lang="ja-JP" data-marpit-pagination="116" style="--paginate:true;--header:6. 飲水動作 ② 区切りを読む;--style:@import 'marp_theme.css';
;" data-marpit-pagination-total="137">
<header>6. 飲水動作 ② 区切りを読む</header>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">t = np.arange(<span class="hljs-built_in">len</span>(d3)) / dfps
fig, axes = plt.subplots(<span class="hljs-number">2</span>, <span class="hljs-number">1</span>, sharex=<span class="hljs-literal">True</span>)
axes[<span class="hljs-number">0</span>].plot(t, height)
axes[<span class="hljs-number">0</span>].set_ylabel(<span class="hljs-string">&#x27;手の高さ [m]&#x27;</span>)
axes[<span class="hljs-number">1</span>].plot(t, elbow)
axes[<span class="hljs-number">1</span>].set_ylabel(<span class="hljs-string">&#x27;肘の屈曲角 [度]&#x27;</span>)
axes[<span class="hljs-number">1</span>].set_xlabel(<span class="hljs-string">&#x27;時間 [秒]&#x27;</span>)
plt.show()
</code></pre>
<p><code>plt.subplots(2, 1)</code>は、グラフを縦に2つ並べる命令</p>
</section>

<header>6. 飲水動作 ③ 速さの山</header>

<h1 id="%E9%80%9F%E3%81%95%E3%81%AE%E5%B1%B1%E3%82%92%E6%95%B0%E3%81%88%E3%82%8B">速さの山を数える</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">dspeed = np.linalg.norm(np.diff(hand, axis=<span class="hljs-number">0</span>), axis=<span class="hljs-number">1</span>) * dfps

                      prominence=dsmooth.<span class="hljs-built_in">max</span>() * <span class="hljs-number">0.4</span>)
<span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;山の数&#x27;</span>, <span class="hljs-built_in">len</span>(peaks), <span class="hljs-string">&#x27;山の時刻（秒）&#x27;</span>, np.<span class="hljs-built_in">round</span>(peaks / dfps, <span class="hljs-number">1</span>))
</code></pre>

</code></pre>

;" data-marpit-pagination-total="137">
<header>6. 飲水動作 ③ 速さの山</header>

<h1 id="%E6%8C%81%E3%81%A1%E4%B8%8A%E3%81%92%E3%82%8B%E5%B1%B1%E3%81%AF%E3%81%A9%E3%81%93%E3%81%AB">持ち上げる山はどこに？</h1>
<p>山は下ろすとき（23〜25秒）の2つだけ。動画が持ち上げる途中から始まるので、持ち上げの山は取れない。どこから撮り始めるかで、測れるものが決まる</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="120" data-paginate="true" data-header="6. 飲水動作 ④ 自分のリーチ" data-style="@import 'marp_theme.css';

<h1 id="%E3%82%84%E3%81%A3%E3%81%A6%E3%81%BF%E3%82%88%E3%81%86%E8%87%AA%E5%88%86%E3%81%AE%E3%83%AA%E3%83%BC%E3%83%81">やってみよう：自分のリーチ</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> google.colab <span class="hljs-keyword">import</span> files
uploaded = files.upload()
my_reach = <span class="hljs-built_in">list</span>(uploaded.keys())[<span class="hljs-number">0</span>]
r2, r3, rfps = track_pose(my_reach)
r_hand = r3[:, <span class="hljs-number">16</span>] - (r3[:, <span class="hljs-number">11</span>] + r3[:, <span class="hljs-number">12</span>]) / <span class="hljs-number">2</span>
r_speed = np.linalg.norm(np.diff(r_hand, axis=<span class="hljs-number">0</span>), axis=<span class="hljs-number">1</span>) * rfps
r_smooth = savgol_filter(np.nan_to_num(r_speed), window_length=<span class="hljs-number">15</span>, polyorder=<span class="hljs-number">2</span>)
plt.plot(np.arange(<span class="hljs-built_in">len</span>(r_smooth)) / rfps, r_smooth)
plt.xlabel(<span class="hljs-string">&#x27;時間 [秒]&#x27;</span>)
plt.ylabel(<span class="hljs-string">&#x27;右手首の速さ [m/s]&#x27;</span>)
plt.show()
</code></pre>

<h1 id="%E6%89%8B%E3%81%AE21%E7%82%B9">手の21点</h1>
<ul>

<header>7. 手指 ① 手の21点</header>

<h1 id="%E6%89%8B%E3%81%AE%E3%83%A2%E3%83%87%E3%83%AB%E3%82%92%E5%91%BC%E3%81%B6%E9%96%A2%E6%95%B0">手のモデルを呼ぶ関数</h1>
<table>
<thead>
<tr>
<th>関数</th>
<th>役割</th>
<th>入力</th>
<th>出力</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>track_hand</code></td>
<td>全コマで手の21点を出す</td>

</tr>
</tbody>

<p class="note">ノートの「28.」。中身は`track_pose`と同じ形で、読み飛ばしてよい</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="126" data-paginate="true" data-header="7. 手指 ② 指と手首を測る" data-style="@import 'marp_theme.css';
" lang="ja-JP" data-marpit-pagination="126" style="--paginate:true;--header:7. 手指 ② 指と手首を測る;--style:@import 'marp_theme.css';
;" data-marpit-pagination-total="137">
<header>7. 手指 ② 指と手首を測る</header>

<h1 id="%E6%8C%87%E3%81%AE%E6%9B%B2%E3%81%8C%E3%82%8A%E3%81%A8%E6%89%8B%E9%A6%96%E3%81%AE%E9%AB%98%E3%81%95">指の曲がりと手首の高さ</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">hand_measures</span>(<span class="hljs-params">name</span>):
    points, fps = track_hand(name + <span class="hljs-string">&#x27;.mp4&#x27;</span>)
    pip = np.array([<span class="hljs-number">180</span> - angle_between_vectors(p[<span class="hljs-number">5</span>] - p[<span class="hljs-number">6</span>], p[<span class="hljs-number">7</span>] - p[<span class="hljs-number">6</span>]) <span class="hljs-keyword">for</span> p <span class="hljs-keyword">in</span> points])
    size = np.nanmedian(np.linalg.norm(points[:, <span class="hljs-number">9</span>] - points[:, <span class="hljs-number">0</span>], axis=<span class="hljs-number">1</span>))
    rise = -(points[:, <span class="hljs-number">0</span>, <span class="hljs-number">1</span>] - np.nanmedian(points[:<span class="hljs-number">15</span>, <span class="hljs-number">0</span>, <span class="hljs-number">1</span>])) / size
    <span class="hljs-built_in">print</span>(name, <span class="hljs-string">&#x27;コマ数&#x27;</span>, <span class="hljs-built_in">len</span>(points), <span class="hljs-string">&#x27;手が見つかったコマの割合&#x27;</span>,
          <span class="hljs-built_in">round</span>(np.mean(~np.isnan(points[:, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>])), <span class="hljs-number">2</span>))
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;  人差し指のPIPの屈曲（中央値）&#x27;</span>, <span class="hljs-built_in">round</span>(np.nanmedian(pip), <span class="hljs-number">1</span>),
          <span class="hljs-string">&#x27; 手首の上がり方の最大（手の大きさ）&#x27;</span>, <span class="hljs-built_in">round</span>(np.nanmax(rise), <span class="hljs-number">2</span>))
    <span class="hljs-keyword">return</span> pip, rise, fps

ok_pip, ok_rise, hand_fps = hand_measures(<span class="hljs-string">&#x27;lift_complete&#x27;</span>)
ng_pip, ng_rise, hand_fps = hand_measures(<span class="hljs-string">&#x27;lift_incomplete&#x27;</span>)
</code></pre>
</section>

<header>7. 手指 ② 指と手首を測る</header>

<h1 id="2%E3%81%A4%E3%81%AE%E3%81%8B%E3%81%9F%E3%81%BE%E3%82%8A%E3%81%A7%E8%AA%AD%E3%82%80">2つのかたまりで読む</h1>
<ol>
<li>人差し指のPIPの屈曲角：PIPを軸に、PIP→付け根とPIP→DIPのなす角を180°から引く</li>
<li>手首の高さ：最初の15コマからの上がり方を、手の大きさ（手首→中指の付け根）を1として表す</li>
</ol>
<p class="note">手の大きさで割るので、カメラからの距離が違っても比べられる</p>
</section>

<p>スマホ動画1本から、この上肢は良くなったと言えるか</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="134" data-paginate="true" data-header="まとめ" data-style="@import 'marp_theme.css';

<header>まとめ</header>

<h1 id="%E8%A8%80%E3%81%88%E3%82%8B%E3%81%93%E3%81%A8">言えること</h1>
<ul>
<li>正面から撮れば、MediaPipeの2Dでも正解との差は4°ほど</li>
<li>今日の撮り方なら、ピークの平均が17°を超えて変われば「変わった」と言える</li>
<li>撮る向きと指示をそろえれば、この幅は小さくできる</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="135" data-paginate="true" data-header="まとめ" data-style="@import 'marp_theme.css';

<ul>
<li>確かめたのは健常な人の外転。屈曲や患者さんの動きは確かめていない</li>
<li>推定の揺れと本人の揺れは、今日のデータでは分けきれていない</li>
<li>飲水動作と手指は正解がなく、角度の正しさは確かめていない</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="136" data-paginate="true" data-header="まとめ" data-class="lead" data-style="@import 'marp_theme.css';
